name: finder

on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Scrape dba.dk
        run: uv run scraper.py > ads.txt

      - name: Filter with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat filter_prompt.txt ads.txt | tee prompt.txt
          jq -n --rawfile p prompt.txt \
            '{contents:[{parts:[{text:$p}]}]}' > request.json
          curl -sS https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            | jq -r '.candidates[0].content.parts[0].text // .error.message' > result.txt

      - name: Send mail
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: uv run mail.py < result.txt
